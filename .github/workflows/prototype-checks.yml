name: Prototype checks
on:
  pull_request:
  push:
    branches: [main, codex/complete-ux-workflows]
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: validate
        run: npm run validate
      - run: node tests/gate.mjs --shots
      - if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: node tests/signature-journey.mjs phone
      - if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: node tests/upgrade-workflows.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prototype-browser-review
          path: |
            qa/gate/
            qa/upgrade/
            review/screenshots-or-captures/journey/
          retention-days: 7
